<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Primer Mes</title>
    <!-- Fuente elegante de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0714; /* Fondo morado súper oscuro y elegante */
            color: #f3e8ff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Estrellitas decorativas sutiles en el fondo */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(216, 180, 254, 0.4) 1px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 25px 25px;
            opacity: 0.2;
            z-index: -1;
        }

        /* Sticker de Spider-Man asomándose arriba */
        .sticker-spider {
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: auto;
            z-index: 10;
            filter: drop-shadow(0 5px 15px rgba(168, 85, 247, 0.3));
        }

        /* Sticker de flores abajo a la derecha */
        .sticker-flores {
            position: absolute;
            bottom: 10px;
            right: 15px;
            width: 110px;
            height: auto;
            z-index: 10;
            filter: drop-shadow(0 5px 15px rgba(168, 85, 247, 0.3));
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 650px;
            z-index: 2;
        }

        .subtitle-top {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #d8b4fe;
            margin-bottom: 15px;
            font-weight: 400;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.8rem;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(216, 180, 254, 0.4);
        }

        /* Contenedor de las manos con brillo romántico */
        .imagen-manos-container {
            margin: 20px auto;
            display: inline-block;
            position: relative;
        }

        .imagen-manos-container::after {
            content: '';
            position: absolute;
            inset: -10px;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.35) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(8px);
        }

        .imagen-manos {
            width: 130px;
            height: auto;
            border-radius: 50%;
            display: block;
            margin: 0 auto;
            border: 2px solid rgba(216, 180, 254, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .message {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.25rem;
            color: #e9d5ff;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }

        .btn-comenzar {
            display: inline-block;
            padding: 12px 35px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f3e8ff;
            background: transparent;
            border: 1px solid rgba(216, 180, 254, 0.5);
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.15);
        }

        .btn-comenzar:hover {
            background: #d8b4fe;
            color: #0b0714;
            border-color: #d8b4fe;
            box-shadow: 0 0 25px rgba(216, 180, 254, 0.6);
            transform: translateY(-2px);
        }

        /* Adaptabilidad para celulares */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.8rem;
            }
            .container {
                padding: 15px;
            }
            .sticker-spider {
                width: 70px;
            }
            .sticker-flores {
                width: 90px;
            }
        }
    </style>
</head>
<body>

    <!-- Spider-Man asomándose arriba -->
    <img src="spiderman. png.png" class="sticker-spider" alt="Spider-Man asomándose">[cite: 6]

    <div class="container">
        <div class="subtitle-top">Para mi niño precioso</div>
        
        <h1>Nuestro primer<br>mes</h1>

        <div class="imagen-manos-container">
            <!-- Manos al centro con brillo -->
            <img src="1111.png.jpg" class="imagen-manos" alt="Manos a punto de tocarse">[cite: 6]
        </div>

        <p class="message">Una pequeña sorpresa hecha especialmente para ti.</p>

        <a href="#" class="btn-comenzar">Comenzar</a>
    </div>

    <!-- Flores abajo a la derecha -->
    <img src="flower.png.png" class="sticker-flores" alt="Flores decorativas">[cite: 6]

</body>
</html>
