<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestro primer mes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, 'Times New Roman', serif;
            background:
                radial-gradient(circle at 50% 40%, #24143d 0%, #100b19 45%, #050507 100%);
            color: #f4f1f8;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #d9d4e2;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 3s infinite ease-in-out;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 30px;
            animation: appear 1.8s ease forwards;
        }

        .small-text {
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 11px;
            color: #aaa1b8;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(45px, 8vw, 90px);
            font-weight: normal;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #c8bfd3;
            font-size: 17px;
            font-style: italic;
            margin-bottom: 45px;
        }

        .heart {
            color: #9c7bc5;
            font-size: 22px;
            margin-bottom: 28px;
            animation: pulse 2s infinite ease-in-out;
        }

        .start-button {
            border: 1px solid #81758f;
            background: rgba(255, 255, 255, 0.03);
            color: #f4f1f8;
            padding: 15px 38px;
            border-radius: 50px;
            font-size: 13px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .start-button:hover {
            background: #7c5aa2;
            border-color: #bca7d4;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(124, 90, 162, 0.35);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
            }

            50% {
                opacity: 0.9;
            }
        }
    </style>
</head>

<body>

    <div class="stars">
        <span class="star" style="top: 15%; left: 12%; animation-delay: 0s;"></span>
        <span class="star" style="top: 25%; left: 82%; animation-delay: 1s;"></span>
        <span class="star" style="top: 70%; left: 20%; animation-delay: 2s;"></span>
        <span class="star" style="top: 78%; left: 76%; animation-delay: 0.5s;"></span>
        <span class="star" style="top: 40%; left: 90%; animation-delay: 1.5s;"></span>
        <span class="star" style="top: 60%; left: 8%; animation-delay: 2.5s;"></span>
    </div>

    <main class="container">

        <div class="small-text">
            para mi persona favorita
        </div>

        <div class="heart">♡</div>

        <h1>Nuestro primer mes</h1>

        <p class="subtitle">
            Una pequeña sorpresa hecha especialmente para ti.
        </p>

        <button class="start-button" onclick="comenzar()">
            COMENZAR
        </button>

    </main>

    <script>
        function comenzar() {
            alert("Aquí comenzará nuestra historia...");
        }
    </script>

</body>
</html>
